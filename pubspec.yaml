name: native_chrome
description: Native UIKit and Android bars with Flutter fallback and Dart-owned navigation.
version: 0.1.0-dev.5
homepage: https://github.com/tsleedev/native_chrome
repository: https://github.com/tsleedev/native_chrome
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.nativechrome.native_chrome
        pluginClass: NativeChromePlugin
      ios:
        pluginClass: NativeChromePlugin
